enum TaskStatus {
  TODO
  IN_PROGRESS
  DONE
}

type Task {
  id: ID!
  workspaceId: String!
  workspace: Workspace
  title: String!
  description: String
  status: TaskStatus
  createdBy: String
  createdByUser: User
  createdAt: String!
  updatedAt: String!
  comments: [TaskComment!]!
}

input CreateTaskInput {
  workspaceId: String!
  title: String!
  description: String
  status: TaskStatus
  createdBy: String!
}

input UpdateTaskInput {
  title: String
  description: String
  status: TaskStatus
}

type Query {
  tasks(workspaceId: String, input: PaginationInput): [Task!]!
  task(id: ID!): Task
}

type Mutation {
  createTask(input: CreateTaskInput!): Task!
  updateTask(id: ID!, input: UpdateTaskInput!): Task!
  deleteTask(id: ID!): Boolean!
}

